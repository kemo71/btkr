# Btkr Valley — nginx reverse proxy (dev / on-prem template).
#
# Production should terminate TLS at the load balancer and pin TLS 1.2+
# with NCA-approved cipher suites. This config is the local-dev / on-prem
# fallback when TLS is terminated upstream.

upstream btkr_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    # NCA ECC — security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Strict CSP comes from the Next.js app; nginx adds belt-and-suspenders.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Service worker must not be cached aggressively
    location = /sw.js {
        proxy_pass http://btkr_app;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # PWA manifest
    location = /manifest.webmanifest {
        proxy_pass http://btkr_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Static assets — long-lived, immutable
    location /_next/static/ {
        proxy_pass http://btkr_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Application
    location / {
        proxy_pass http://btkr_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
